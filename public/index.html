<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chat team</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">CT</div>
        <div>
          <h1>chat team</h1>
          <p>多人 Web GPT 聊天室</p>
        </div>
      </div>

      <section class="panel connection-panel">
        <div class="panel-title">CWapi Coding 模式</div>
        <label>
          <span>Coding 仓库</span>
          <input id="repositoryUrl" value="https://github.com/AAAYNMMM/chat-team" spellcheck="false" />
        </label>
        <label>
          <span>房间名</span>
          <input id="room" value="main" spellcheck="false" />
        </label>
        <label>
          <span>Web GPT 成员（最多 8）</span>
          <input id="participantNames" value="GPT-A, GPT-B, GPT-C" spellcheck="false" />
        </label>
        <label>
          <span>每次讨论轮数</span>
          <select id="rounds">
            <option value="1" selected>1 轮</option>
            <option value="2">2 轮</option>
            <option value="3">3 轮</option>
            <option value="4">4 轮</option>
            <option value="5">5 轮</option>
            <option value="6">6 轮</option>
          </select>
        </label>
        <button id="configureButton" class="primary">应用房间</button>
        <div id="connectionStatus" class="status offline">未配置</div>
      </section>

      <section class="panel join-panel">
        <div class="panel-title row">
          <span>网页窗口启动提示词</span>
          <span id="promptCount" class="badge">3</span>
        </div>
        <p class="hint">每个 Web GPT 窗口只绑定自己的成员名。之后通过 MCPcoding 直接轮询本机 chat-team，消息不会依赖 Agent 广播时机。</p>
        <div id="joinPrompts" class="join-prompts"></div>
      </section>

      <section class="panel participants-panel">
        <div class="panel-title row">
          <span>成员状态</span>
          <span id="participantCount" class="badge">0</span>
        </div>
        <div id="participants" class="participants empty">应用房间后显示成员</div>
      </section>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <div>
          <h2 id="roomTitle"># main</h2>
          <p id="roomSubtitle">Coding 模式 · 本地持久消息队列</p>
        </div>
        <div class="header-state">
          <span id="queueState" class="queue-state">空闲</span>
          <span id="liveState" class="live-state">未配置</span>
        </div>
      </header>

      <section id="messages" class="messages">
        <div class="welcome">
          <div class="welcome-icon">✦</div>
          <h3>一个人类，多个 Coding Web GPT，同一个房间。</h3>
          <p>chat team 保存一次消息，每个成员用自己的读取游标可靠接收。窗口晚一点回来也会继续读未读内容，不再依赖短时 broadcast。</p>
        </div>
      </section>

      <footer class="composer">
        <textarea id="messageInput" rows="1" placeholder="应用房间后发送消息…" disabled></textarea>
        <button id="sendButton" class="send" disabled>发送</button>
      </footer>
    </main>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
